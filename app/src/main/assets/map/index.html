<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>Choose observing location</title>
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="map.css">
  <script defer src="leaflet.js"></script>
  <script defer src="map.js"></script>
</head>
<body>
  <div id="map" aria-label="Location map. Drag to move, pinch to zoom, and tap to select a location."></div>
  <noscript>The map needs JavaScript. Use the latitude and longitude fields instead.</noscript>
</body>
</html>
